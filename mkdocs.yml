site_name: PMT MLSecOps
site_description: Pipeline MLOps para detección de ataques web con integración Blue Team y Red Team
site_author: Permotion
site_url: https://permotion.github.io/PMT_MLSecOps

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Inicio: index.md
  - Contexto y Motivación:
    - Contexto: contexto.md
    - Objetivos: objetivos.md
  - Dataset:
    - CSIC 2010: dataset.md
  - Stack Tecnológico: stack.md
  - Arquitectura:
    - Visión general del pipeline: arquitectura.md
    - Fases y Pipeline MLOps: arquitectura_fases.md
    - Pipeline de datos:
      - Stage 0 — Curado del dataset: stage_0_curation.md
      - Stage 1 — Exploración (EDA): stage_1_eda.md
      - Stage 2 — Preprocess: stage_2_preprocess.md
      - Stage 3 — Prototipado: stage_3_experiments.md
      - Stage 4 — Train Model A: stage_4_train.md
    - Gobernanza y deploy:
      - Stage 5 — Promote to staging: stage_5_promote.md
      - Stage 6 — Auditoría Blue Team: stage_6_blue_team_audit.md
      - Stage 7 — Deploy a producción: stage_7_deploy.md
    - Operación:
      - Stage 8 — API Serving: stage_8_api_serving.md
      - Stage 9 — Monitoreo: stage_9_monitoreo.md
      - Stage 10 — Red Team: stage_10_red_team.md
    - Flujo completo (índice 0–10): flujo_completo.md
  - Conceptos Clave:
    - MLOps y gobernanza: conceptos_mlops.md
    - Blue Team y Red Team: conceptos_equipos.md
    - Threshold calibration: conceptos_threshold.md
  - Roles y Responsabilidades:
    - Matriz RACI: raci.md
    - Blue Team Guide: blue_team.md
    - Manual de Aprobación y Deploy: README_deploy.md
    - Red Team Guide: red_team.md
  - Glosario: glosario.md
  - Resultados:
    - Stage 1 — Curation: results/stage_1_results.md
    - Stage 2 — EDA + Preprocess: results/stage_2_results.md
    - Stage 3 — Train Model A: results/stage_3_results.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/permotion

dev_addr: "0.0.0.0:8000"